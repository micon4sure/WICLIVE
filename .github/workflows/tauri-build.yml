name: Build and Release

on:
  push:
    branches: [master]
  workflow_dispatch:
    inputs:
      beta:
        description: "Beta release (no auto-update)"
        type: boolean
        default: true

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: oven-sh/setup-bun@v2

      - run: bun install

      - name: Build Tauri app
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""
          API_URL: https://wiclive.techtile.media
        run: bun run tauri build

      - name: Read version
        id: version
        shell: bash
        run: |
          VERSION=$(jq -r .version src-tauri/tauri.conf.json)
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          if echo "$VERSION" | grep -qE '-(alpha|beta|rc)'; then
            echo "prerelease=true" >> $GITHUB_OUTPUT
          elif [ "${{ inputs.beta }}" = "true" ]; then
            echo "prerelease=true" >> $GITHUB_OUTPUT
          else
            echo "prerelease=false" >> $GITHUB_OUTPUT
          fi

      - name: Check if release exists
        id: check
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view ${{ steps.version.outputs.version }} &>/dev/null; then
            echo "exists=true" >> $GITHUB_OUTPUT
          else
            echo "exists=false" >> $GITHUB_OUTPUT
          fi

      - name: Generate changelog
        if: steps.check.outputs.exists == 'false'
        id: changelog
        shell: bash
        run: |
          PREV_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "")
          if [ -n "$PREV_TAG" ]; then
            NOTES=$(git log "${PREV_TAG}..HEAD" --pretty=format:"- %s" --no-merges)
          else
            NOTES=$(git log --pretty=format:"- %s" --no-merges -20)
          fi
          echo "notes<<EOF" >> $GITHUB_OUTPUT
          echo "$NOTES" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Build version.json
        if: steps.check.outputs.exists == 'false' && steps.version.outputs.prerelease == 'false'
        shell: bash
        run: |
          VERSION=${{ steps.version.outputs.version }}
          SIG=$(cat "src-tauri/target/release/bundle/nsis/WIC LIVE_${VERSION}_x64-setup.nsis.zip.sig")
          NOTES=$(cat <<'NOTESEOF'
          ${{ steps.changelog.outputs.notes }}
          NOTESEOF
          )
          jq -n \
            --arg v "$VERSION" \
            --arg sig "$SIG" \
            --arg url "https://github.com/${{ github.repository }}/releases/download/${VERSION}/wiclive_${VERSION}_x64-setup.nsis.zip" \
            --arg notes "$NOTES" \
            '{
              version: $v,
              notes: $notes,
              platforms: {
                "windows-x86_64": {
                  installMode: "passive",
                  signature: $sig,
                  url: $url
                }
              }
            }' > version.json

      - name: Create release
        if: steps.check.outputs.exists == 'false'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION=${{ steps.version.outputs.version }}
          PRERELEASE=""
          FILES=()
          FILES+=("src-tauri/target/release/bundle/nsis/WIC LIVE_${VERSION}_x64-setup.exe#wiclive_x64-setup.exe")
          if [ "${{ steps.version.outputs.prerelease }}" = "false" ]; then
            FILES+=("src-tauri/target/release/bundle/nsis/WIC LIVE_${VERSION}_x64-setup.nsis.zip#wiclive_${VERSION}_x64-setup.nsis.zip")
            FILES+=("src-tauri/target/release/bundle/nsis/WIC LIVE_${VERSION}_x64-setup.nsis.zip.sig#wiclive_${VERSION}_x64-setup.nsis.zip.sig")
            FILES+=("version.json")
          else
            PRERELEASE="--prerelease"
          fi
          gh release create "$VERSION" \
            --title "Release $VERSION" \
            --notes "${{ steps.changelog.outputs.notes }}" \
            $PRERELEASE \
            "${FILES[@]}"
