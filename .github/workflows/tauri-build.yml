name: Build and Release

on:
  push:
    branches: [master]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Read version and check tag
        id: version
        shell: pwsh
        run: |
          $version = (Get-Content src-tauri/tauri.conf.json | ConvertFrom-Json).version
          echo "version=$version" >> $env:GITHUB_OUTPUT

          # Check if tag already exists
          $tagExists = git tag -l $version
          if ($tagExists) {
            echo "exists=true" >> $env:GITHUB_OUTPUT
          } else {
            echo "exists=false" >> $env:GITHUB_OUTPUT
          }

          # Prerelease if version contains alpha, beta, or rc
          if ($version -match '-(alpha|beta|rc)') {
            echo "prerelease=true" >> $env:GITHUB_OUTPUT
          } else {
            echo "prerelease=false" >> $env:GITHUB_OUTPUT
          }

      - name: Skip if already released
        if: steps.version.outputs.exists == 'true'
        shell: pwsh
        run: |
          echo "Tag ${{ steps.version.outputs.version }} already exists, skipping."
          exit 0

      - uses: oven-sh/setup-bun@v2
        if: steps.version.outputs.exists == 'false'

      - name: Install dependencies
        if: steps.version.outputs.exists == 'false'
        run: bun install

      - name: Build Tauri app (portable)
        if: steps.version.outputs.exists == 'false' && steps.version.outputs.prerelease == 'true'
        env:
          API_URL: https://wiclive.techtile.media
        run: bun run tauri build -- --features portable

      - name: Build Tauri app (installer)
        if: steps.version.outputs.exists == 'false' && steps.version.outputs.prerelease == 'false'
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""
          API_URL: https://wiclive.techtile.media
        run: bun run tauri build

      - name: Generate changelog
        if: steps.version.outputs.exists == 'false'
        id: changelog
        shell: pwsh
        run: |
          $prevTag = git describe --tags --abbrev=0 2>$null
          if ($prevTag) {
            $notes = git log "$prevTag..HEAD" --pretty=format:"- %s" --no-merges
          } else {
            $notes = git log --pretty=format:"- %s" --no-merges -20
          }
          echo "notes<<EOF" >> $env:GITHUB_OUTPUT
          echo "$notes" >> $env:GITHUB_OUTPUT
          echo "EOF" >> $env:GITHUB_OUTPUT

      - name: Create prerelease
        if: steps.version.outputs.exists == 'false' && steps.version.outputs.prerelease == 'true'
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $version = "${{ steps.version.outputs.version }}"
          gh release create $version `
            --title "Release $version" `
            --notes "${{ steps.changelog.outputs.notes }}" `
            --prerelease `
            "src-tauri/target/release/wiclive.exe#wiclive.exe"

      - name: Create stable release
        if: steps.version.outputs.exists == 'false' && steps.version.outputs.prerelease == 'false'
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $version = "${{ steps.version.outputs.version }}"
          $nsis = "src-tauri/target/release/bundle/nsis/wiclive_${version}_x64-setup.exe"
          $nsisZip = "src-tauri/target/release/bundle/nsis/wiclive_${version}_x64-setup.nsis.zip"
          $nsisZipSig = "${nsisZip}.sig"
          $sig = Get-Content $nsisZipSig

          # Build version.json for Tauri auto-updater
          @{
            version = $version
            notes = "${{ steps.changelog.outputs.notes }}"
            platforms = @{
              "windows-x86_64" = @{
                signature = $sig
                url = "https://github.com/${{ github.repository }}/releases/download/${version}/wiclive_${version}_x64-setup.nsis.zip"
              }
            }
          } | ConvertTo-Json -Depth 4 | Set-Content version.json

          gh release create $version `
            --title "Release $version" `
            --notes "${{ steps.changelog.outputs.notes }}" `
            "${nsis}#wiclive_${version}_x64-setup.exe" `
            "${nsisZip}#wiclive_${version}_x64-setup.nsis.zip" `
            "${nsisZipSig}#wiclive_${version}_x64-setup.nsis.zip.sig" `
            "version.json"
